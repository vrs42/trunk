:: Maximum memory, extended address element:
set cpu noeae

#
# The DECstation Technical Manual (VTX78-TM-002) mentions:
# maindec-08-dkvta-a VT78 Memory Diagnostic
# maindec-08-dkvtb-a VT78 CPU Diagnostic
# maindec-08-djexc-b PDP8A Processor Ecerciser
# maindec-08-dirxa-d RX01 Diagnostics
# maindec-08-dirxb-e RX01 Reliability Exerciser
# maindec-08-dilac-b LA180 Printer Diagnostic
# maindec-08-dhlqa-b LQP-8 Printer Diagnostic
# as well as diagnositics resident in front panel memory.

# It is not clear if the panel memory needs to be emulated
# for correct emulation of VT78 and DECmates.

do diags/08-dkvta
do diags/08-dkvtb
#do diags/08-djexc # BUGBUG: Doesnt' pass yet
#do diags/08-dirxa
#do diags/08-dirxb
