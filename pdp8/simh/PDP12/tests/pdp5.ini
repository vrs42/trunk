:: Maximum memory, extended address element:
#set cpu 4k
#set cpu noeae
#
# The PDP-5 Maintenance Manual (F-57) mentions:
# maindec-05-501 Instruction Test (aka 08-801, 5-12-M)
# maindec-05-502 Memory Checkerboard (08-802, 5-15M)
# maindec-05-503 Memory Address Test (08-803, 5-16-M)
# maindec-05-510 Tape Reader Test (08-810, 5-13-M)
# maindec-05-512 Tape Punch Test (08-812, 5-14-M)
# maindec-05-514 Teleprinter Test (08-814, 5-19-M)
#
# The 1964 Program Library also mentions these additional:
# maindec-08-811 High Speed Reader Test (5-40-M)
# maindec-08-817 High Speed Punch Test (5-44-M)
# maindec-08-820 Extended Memory Test (5-50-M)

do diags/501-1
do diags/501-2a
do diags/501-2b
#do diags/501-2c # JMP-JMS
# EAE with PDP-5 should be supported, but isn't!
do diags/501-3a
#do diags/501-3b
do diags/502
do diags/503
