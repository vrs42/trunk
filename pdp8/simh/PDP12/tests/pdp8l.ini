:: Maximum memory, extended address element:
#set cpu 4k
set cpu noeae

#
# The PDP-8/L Maintenance Manual (8L-HR1B) mentions:
# maindec-8i-d01[bc] Instruction Test 1
# maindec-8i-d02b Instruction Test 2
# maindec-08-d02a Instruction Test 2B
# maindec-08-d04b Random JMP Test
# maindec-08-d05b Random JMP/JMS Test
# maindec-08-d07b Random ISZ Test
# maindec-08-d1j0 Memory Checkerboard
# maindec-08-d1b0 Memory Address Test
# maindec-8i-d2pb Tape Reader Test
# maindec-8i-d2qb Tape Punch Test
# maindec-8i-d2rb Keyboard Test
# maindec-8i-d2tb Printer/Punch Test
#
# Which is essentially the same list as for the low end 8/I.

do diags/8i-d01c
do diags/8i-d02b
do diags/08-d02b
do diags/08-d04b
do diags/08-d05b
do diags/08-d07b
do diags/08-d1b0
do diags/08-d1l0
# 08-d1j0 Memory Checkerboard
# 08-d1e0 Extended Memory Checkerboard (instead?)
#do diags/8i-d2pe
#do diags/8i-d2qd
