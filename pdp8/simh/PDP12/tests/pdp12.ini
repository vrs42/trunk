:: pdp12_test.ini
::
:: Run the paper tape-based diagnostics for the PDP-12 simulator.
::
::
:: Script is where the diagnostics ought to reside as well.
cd %~p0

:: Limit maximum diagnostic execution time
norunlimit
runlimit 1500M instructions
set on
on error ignore
on runtime echof "\r\n*** Test Runtime Limit %SIM_RUNLIMIT% %SIM_RUNLIMIT_UNITS% Exceeded ***\n"; e pc; exit 1

:: Maximum memory, extended address element:
set cpu 32k
set cpu eae

#
# The PDP-12 Maintenance Manual Vol. 2 (12-HR2B) mentions:
# maindec-8i-do1c Instruction Test 1
# maindec-8i-d02b Instruction Test 2
# maindec-08-d02b Instruction Test 2B
# maindec-08-d04b Random JMP Test
# maindec-08-d05b Random JMP/JMS Test
# maindec-08-d07b Random ISZ Test
# maindec-08-d1ac Memory Power On/Off Test
# maindec-08-d1b1 Memory Address Test (Low)
# maindec-08-d1b2 Memory Address Test (High)
# maindec-08-d1l1 Memory Checkerboard (Low)
# maindec-08-d1l2 Memory Checkerboard (High)
# maindec-08-d2pe Teletype Test Part 1
# maindec-08-d2qd Teletype Test Part 2
# maindec-12-d0ab PDP-12 CP Test 2
# maindec-12-d0ba Instruction Test 1
# maindec-12-d0ca CP Test 3
# maindec-12-d1ba JMP Self
# maindec-12-d1da PDP-12 Checkerboard
# maindec-12-d1ea Float 1's and 0's
# maindec-12-d3ac Tape Control Tests
# maindec-12-d3ae Tape Control Test
#
# Of these, some require PDP-12 specific devices:
# maindec-12-d6ba Display Test (VR12)
# maindec-12-d6cb A-D Test
# maindec-12-d8ab DR12 Relay Register Test

# These are often newer versions than those in the manual.
# First, the tests above which test the PDP-8 side, which
# essentially is a pdp8i.
do diags/8i-d01c
do diags/8i-d02b
do diags/08-d02b
do diags/08-d04b
do diags/08-d05b
do diags/08-d07b
do diags/08-d1b0
# The 08-d1j0 test above replaces 08-d1l0, but we only
# have the latter.
do diags/08-d1l0
# 08-d1e0 Extended Memory Checkerboard (instead?)
