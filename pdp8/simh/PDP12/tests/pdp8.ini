:: Maximum memory, extended address element:
#set cpu 4k
#set cpu noeae

#
# The PDP-8 Maintenance Manual (F-87) mentions:
# maindec-08-801 Instruction Test (Parts 1 and 2)
# maindec-08-801 EAE Instruction Test (Part 3)
# maindec-08-801 Extended Memory Test (Part 4)
# maindec-08-802 Memory Checkerboard
# maindec-08-803 Memory Address Test
# maindec-08-810 Tape Reader Test
# maindec-08-812 Tape Punch Test
# maindec-08-814 Teleprinter Test
#
# These are essentially the same tests as for the PDP-5.
# The 1964 PDP-5 Program Library also mentions these additional:
# maindec-08-811 High Speed Reader Test (5-40-M)
# maindec-08-817 High Speed Punch Test (5-44-M)

do diags/801-1
do diags/801-2a
do diags/801-2b
#do diags/801-2c
do diags/801-3a
do diags/802
do diags/803
