:: Establish configuration to be tested:
:: Maximum memory, extended address element
set cpu 32k
set cpu eae

#
# These tests are mentioned in Maintenance Manual Vol. 1 (8E-HMM1):
# maindec-8e-d0aa Instruction Test 1
# maindec-8e-d0ba Instruction Test 2
# maindec-8e-d0ca Adder Test
# maindec-8e-d0ia Basic JMP/JMS Test
# maindec-8e-d0da Random AND Test
# maindec-8e-d0ea Random TAD Test
# maindec-8e-d0fa Random ISZ Test
# maindec-8e-d0ga Random DCA Test
# maindec-8e-d0ha Random JMP Test
# maindec-8e-d0ja Random JMP/JMS Test
# maindec-8e-d1ea Memory Address Test
# maindec-8e-d1aa Checkerboard Test
# maindec-8e-d2aa Teletype Control Test

# The last letter of the diagnostic name is a version number.
# Many of these are newer versions than the ones mentioned above.
do diags/8e-d0ab # Instruction Test 1 (08-dhkaf)
do diags/8e-d0bb # Instruction Test 2 (08-dhkag)
do diags/8e-d0cc # Adder Test (08e-dhkaa)
do diags/8e-d0ia # Basic JMP/JMS Test (8e-d0i)
do diags/8e-d0db # Random AND Test (08-dhkab)
do diags/8e-d0eb # Random TAD Test (8e-d0e)
do diags/8e-d0fc # Random ISZ Test (8e-d0f)
do diags/8e-d0gc # Random DCA Test (8e-d0g)
do diags/8e-d0hc # Random JMP Test (8e-d0h)
do diags/8e-d0ja # Random JMP/JMS Test (8e-d0j)
do diags/8e-d1ec # Memory Address Test (08-dhkad)
do diags/8e-d1ab # Checkerboard Test
