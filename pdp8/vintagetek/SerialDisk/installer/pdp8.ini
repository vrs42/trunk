# Instructions:
# Run 'pdp8' in this directory, and assuming socat and xterm are installed,
# the server should start automatically and the system should boot.
:starter
SET ON
ON OPENERR
ON OPENERR GOTO telerr
at ttix 2222;notelnet
ON OPENERR
#br 7732; "e l; e ac; c"
set ttox0 8b
echo Starting socat...
! socat PTY,echo=0,link=ttyPDP TCP:localhost:2222 &
echo Waiting for socat...
! sleep 2
echo Starting SerialDisk server...
# Set up the server with a boot volume and two output volumes.
! xterm -e "bash -c \"../server/server -1 ./diagpack2.new -2 ./tek0.new -3 ./tek1.new \"" &
! sleep 1
echo Booting...
set vc8 ena
load ../bootloader/bootloader.bin
# These simulate the two RK05 we want to copy.
at rk0 ../disks/tek0.dsk
at rk1 ../disks/tek1.dsk
go
#e 100-400
#e state
goto done
:byebye
detach ttix
quit
:telerr
echo TTIX has not released port. Retrying now...
! sleep 2
goto starter
:done
